name: Approve PR (lab test)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Номер PR'
        required: true
        default: '1'

permissions:
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve pull request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(context.payload.inputs.pr_number),
              event: 'APPROVE',
              body: "Рев'ю схвалено для тестування CI/CD пайплайну."
            });
