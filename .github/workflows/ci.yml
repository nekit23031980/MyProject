name: CI Pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested]
    branches:
      - develop
  # Подія "submitted" належить не pull_request, а pull_request_review:
  # завдяки їй перевірка перезапускається після схвалення рев'ю.
  pull_request_review:
    types: [submitted]
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: pytest --junitxml=report.xml --cov=src --cov-report=xml

      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.xml
            coverage.xml

  analysis:
    name: analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ---------- Завдання 2: перевірка код-рев'ю ----------
      - name: Code Review Check for develop
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info("Подія не пов'язана з pull request, перевірку пропущено");
              return;
            }
            if (pr.base.ref !== 'develop') {
              core.setFailed(`Цільова гілка PR: ${pr.base.ref}, очікується develop`);
              return;
            }
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            core.info(`Знайдено рев'ю: ${reviews.length}`);
            for (const r of reviews) {
              core.info(`- ${r.user.login}: ${r.state} (${r.submitted_at})`);
            }
            const approved = reviews.some(review => review.state === 'APPROVED');
            if (!approved) {
              core.setFailed("Код-рев'ю не схвалено");
            }

      # ---------- Завдання 3: метрики та статичний аналіз ----------
      - name: Count lines of code with Cloc
        run: |
          sudo apt-get install -y cloc
          cloc src/ > cloc-report.txt
          cat cloc-report.txt

      - name: Upload Cloc report
        uses: actions/upload-artifact@v4
        with:
          name: cloc-report
          path: cloc-report.txt

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
          unzip -q sonar-scanner-cli-4.8.0.2856-linux.zip
          export PATH=$PATH:$(pwd)/sonar-scanner-4.8.0.2856-linux/bin
          sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"

      # ---------- Завдання 4: Reviewdog ----------
      - name: Запуск flake8 через Reviewdog
        uses: reviewdog/action-flake8@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: error

      - name: Запуск Black через Reviewdog
        uses: reviewdog/action-black@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: info

      # ---------- Завдання 5(g): список змін у develop ----------
      - name: Перевірка змін у гілці develop
        run: |
          git fetch origin develop
          git log origin/develop --oneline --graph > develop_changes.txt
          cat develop_changes.txt

      - name: Upload develop changes report
        uses: actions/upload-artifact@v4
        with:
          name: develop-changes
          path: develop_changes.txt
